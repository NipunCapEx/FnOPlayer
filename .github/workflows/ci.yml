name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        type: choice
        default: full
        options: [full, backend, frontend, android, repository]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and secret hygiene
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'repository' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required governance files
        run: |
          set -euo pipefail
          test -f .github/copilot-instructions.md
          test -f .ai/repo-profile.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f docs/architecture/fno-hedging-dashboard.md
          test -f docs/qa/coverage-inventory.md
          test -f docs/release/runbook.md
      - name: Validate deployment smoke script syntax
        run: bash -n scripts/release-smoke.sh
      - name: Scan for leaked secrets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --redact --exit-code 1

  backend:
    name: Backend - typecheck, tests and coverage
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'backend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Formatting check
        shell: bash
        run: |
          if npm run format:check; then
            exit 0
          fi
          echo "Prettier's suggested patch follows. This diagnostic does not make the check pass."
          npx prettier --write "src/**/*.ts" "test/**/*.ts" "vitest.config.ts" "tsconfig.json" "package.json"
          git --no-pager diff -- src test tsconfig.json
          exit 1
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests with coverage
        run: npm run test:coverage

  frontend:
    name: Flutter - analyze, tests and web build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'frontend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether Flutter app exists
        id: flutter
        shell: bash
        run: |
          if [ -f apps/flutter/pubspec.yaml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Flutter app not introduced yet; frontend checks are not applicable."
          fi
      - uses: subosito/flutter-action@v2
        if: steps.flutter.outputs.available == 'true'
        with:
          channel: stable
          cache: true
      - working-directory: apps/flutter
        if: steps.flutter.outputs.available == 'true'
        run: flutter pub get
      - working-directory: apps/flutter
        if: steps.flutter.outputs.available == 'true'
        shell: bash
        run: |
          if dart format --output=none --set-exit-if-changed .; then
            exit 0
          fi
          dart format .
          git --no-pager diff -- '*.dart'
          exit 1
      - working-directory: apps/flutter
        if: steps.flutter.outputs.available == 'true'
        run: flutter analyze
      - working-directory: apps/flutter
        if: steps.flutter.outputs.available == 'true'
        run: flutter test --coverage
      - working-directory: apps/flutter
        if: steps.flutter.outputs.available == 'true'
        run: flutter build web --release
      - name: Set up Java for Android smoke build
        if: steps.flutter.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile generated Android auth diagnostics bridge
        if: steps.flutter.outputs.available == 'true'
        working-directory: apps/flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.nipun.finance --project-name fno .
          MAIN_ACTIVITY="android/app/src/main/kotlin/com/nipun/finance/fno/MainActivity.kt"
          mkdir -p "$(dirname "$MAIN_ACTIVITY")"
          cp tool/android/MainActivity.kt "$MAIN_ACTIVITY"
          flutter build apk --debug

  android-release-build:
    name: Android release build (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'full' || inputs.scope == 'android') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether Flutter app exists
        id: flutter
        shell: bash
        run: |
          if [ -f apps/flutter/pubspec.yaml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Flutter app not introduced yet; Android release build is not applicable."
          fi
      - uses: subosito/flutter-action@v2
        if: steps.flutter.outputs.available == 'true'
        with:
          channel: stable
          cache: true
      - working-directory: apps/flutter
        if: steps.flutter.outputs.available == 'true'
        run: flutter pub get
      - name: Generate Android platform scaffolding when absent
        if: steps.flutter.outputs.available == 'true'
        working-directory: apps/flutter
        shell: bash
        run: |
          # Regenerate stale Android scaffolding: Flutter 3.16+ removed the v1 embedding.
          # The platform directory is generated in CI and is not source-controlled.
          if [ -f android/app/src/main/java/io/flutter/app/FlutterActivity.java ] ||
             grep -R -E 'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|GeneratedPluginRegistrant\.registerWith' android/app/src/main 2>/dev/null; then
            echo "Detected deprecated Android v1 embedding; regenerating Android platform files."
            rm -rf android
          fi
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --org com.nipun.finance --project-name fno .
          fi
          grep -R -n -E 'io\.flutter\.app\.FlutterActivity|io\.flutter\.app\.FlutterApplication|GeneratedPluginRegistrant\.registerWith' android/app/src/main && {
            echo "::error::Deprecated Android v1 embedding remains after scaffolding generation."
            exit 1
          } || true
          sed -i 's/android:label="[^"]*"/android:label="FnO Players"/' android/app/src/main/AndroidManifest.xml
      - working-directory: apps/flutter
        if: steps.flutter.outputs.available == 'true'
        run: flutter build apk --release
      - name: Upload installable Android APK
        if: steps.flutter.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foplayer-android-release
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  status:
    name: Required CI summary
    if: always()
    needs: [repository, backend, frontend, android-release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Enforce required PR gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope || 'full' }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          ANDROID_RESULT: ${{ needs.android-release-build.result }}
        run: |
          set -euo pipefail
          for result in "$REPOSITORY_RESULT" "$BACKEND_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required repository/backend job failed: $result"
              exit 1
            fi
          done
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$SCOPE" = "full" ] || [ "$SCOPE" = "frontend" ]; then
            if [ "$FRONTEND_RESULT" != "success" ] && [ "$FRONTEND_RESULT" != "skipped" ]; then
              echo "Frontend validation failed: $FRONTEND_RESULT"
              exit 1
            fi
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$SCOPE" = "full" ] || [ "$SCOPE" = "android" ]; }; then
            if [ "$ANDROID_RESULT" != "success" ] && [ "$ANDROID_RESULT" != "skipped" ]; then
              echo "Android release build failed: $ANDROID_RESULT"
              exit 1
            fi
          fi
      - name: Publish required status context
        if: ${{ always() && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope || 'full' }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          ANDROID_RESULT: ${{ needs.android-release-build.result }}
        with:
          script: |
            const acceptable = (result) => result === 'success' || result === 'skipped';
            let passed = acceptable(process.env.REPOSITORY_RESULT) &&
              acceptable(process.env.BACKEND_RESULT);

            const eventName = process.env.EVENT_NAME;
            const scope = process.env.SCOPE;
            const frontendRequired =
              eventName !== 'workflow_dispatch' ||
              scope === 'full' ||
              scope === 'frontend';
            const androidRequired =
              eventName === 'workflow_dispatch' &&
              (scope === 'full' || scope === 'android');

            if (frontendRequired) {
              passed = passed && acceptable(process.env.FRONTEND_RESULT);
            }
            if (androidRequired) {
              passed = passed && acceptable(process.env.ANDROID_RESULT);
            }

            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? 'success' : 'failure',
              context: 'Required CI summary',
              description: passed
                ? 'All required CI jobs passed'
                : 'One or more required CI jobs failed',
            });
