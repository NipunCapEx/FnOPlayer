name: Release Control (Manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Choose what to run
        required: true
        type: choice
        default: backend
        options:
          - android
          - backend
          - both
      validation:
        description: Android validation level (used when Android is selected)
        required: true
        type: choice
        default: full
        options:
          - full
          - fast
      commit_id:
        description: Optional full commit SHA for Render; blank deploys latest commit on the service's configured branch
        required: false
        type: string
      clear_cache:
        description: Render build cache policy
        required: true
        type: choice
        default: do_not_clear
        options:
          - do_not_clear
          - clear

permissions:
  contents: read
  actions: read

concurrency:
  group: release-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  android_build:
    name: Android - Validate and build signed artifacts
    if: ${{ inputs.target == 'android' || inputs.target == 'both' }}
    uses: ./.github/workflows/android-release.yml
    with:
      validation: ${{ inputs.validation }}
    secrets: inherit

  android_publish:
    name: Android - Publish to Google Play
    needs: android_build
    if: ${{ (inputs.target == 'android' || inputs.target == 'both') && needs.android_build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download AAB from this run
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Select and validate App Bundle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find release -type f -name '*.aab' -print)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one AAB from the Android build; found ${#bundles[@]}."
            find release -maxdepth 4 -type f -print || true
            exit 1
          fi
          mkdir -p publish
          cp "${bundles[0]}" publish/app-release.aab
          test -s publish/app-release.aab

      - name: Validate Google Play credential
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$PLAY_SERVICE_ACCOUNT" || { echo "::error::Missing Actions secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."; exit 1; }

      - name: Publish to Google Play internal and closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_APPLICATION_ID }}
          releaseFiles: publish/app-release.aab
          tracks: internal,alpha
          status: completed

  render_deploy:
    name: Backend - Deploy to Render
    if: ${{ inputs.target == 'backend' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Render deployment configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          COMMIT_ID: ${{ inputs.commit_id }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "::error::Missing Actions secret RENDER_API_KEY."; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "::error::Missing Actions variable RENDER_SERVICE_ID."; exit 1; }
          if [ -n "$COMMIT_ID" ] && ! [[ "$COMMIT_ID" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_id must be a full 40-character Git commit SHA or blank."
            exit 1
          fi

      - name: Request Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          COMMIT_ID: ${{ inputs.commit_id }}
          CLEAR_CACHE: ${{ inputs.clear_cache }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/render-deploy-payload.json
          import json, os
          payload = {"clearCache": os.environ["CLEAR_CACHE"]}
          if os.environ.get("COMMIT_ID", "").strip():
              payload["commitId"] = os.environ["COMMIT_ID"].strip()
          print(json.dumps(payload))
          PY
          echo "Requesting Render deployment for service $RENDER_SERVICE_ID."
          # Do not blindly retry this POST: a lost response can hide an accepted deployment.
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/render-deploy-payload.json \
            --output /tmp/render-deploy-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/render-deploy-response.json").read_text())
          deploy = data.get("deploy", data) if isinstance(data, dict) else {}
          print("Render accepted the deployment request.")
          if isinstance(deploy, dict):
              for key in ("id", "status", "createdAt"):
                  if deploy.get(key) is not None:
                      print(f"{key}: {deploy[key]}")
          PY
