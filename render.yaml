services:
  - type: web
    name: fnoplayer-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Set to the exact existing Firestore database ID; leave the value unset until verified.
      - key: FIRESTORE_DATABASE_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_ALLOWED_UIDS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FOPLAYER_YAHOO_CHART_BASE_URL
        value: https://query1.finance.yahoo.com/v8/finance/chart
      - key: FOPLAYER_MARKET_DATA_TIMEOUT_MS
        value: "10000"
      - key: FOPLAYER_MARKET_HOLIDAYS
        value: ""
      - key: FOPLAYER_MARKET_OPEN
        value: "09:15"
      - key: FOPLAYER_MARKET_CLOSE
        value: "15:30"
      - key: FOPLAYER_MARKET_SPECIAL_SESSIONS
        value: "{}"
